# 本專案專用的輕量 CI：只做語法檢查（不裝 torch 等重依賴，10 秒內完成）
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Compile-check Python sources
        run: python -m compileall -q pdebench tests
